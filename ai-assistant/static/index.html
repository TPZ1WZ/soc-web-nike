<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>AI Investigation Assistant — Cloud SOC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js"></script>
<style>
  :root{--bg:#f4f6fb;--panel:#fff;--line:#e6e9f2;--ink:#1e293b;--mut:#64748b;--acc:#2563eb;--acc-soft:#eef4ff;
    --crit:#ef4444;--high:#f97316;--med:#f59e0b;--low:#3b82f6;}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  .mono{font-family:'JetBrains Mono',monospace}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}
  .app{display:grid;grid-template-columns:210px 1fr;height:100vh;overflow:hidden}
  /* sidebar */
  .side{background:#fff;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
  .brand .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#2563eb,#1e40af);display:grid;place-items:center;color:#fff;font-size:16px}
  .brand b{font-size:13.5px;font-weight:800;line-height:1.15;display:block}
  .brand .cloud{font-size:9px;color:#fff;background:var(--acc);padding:1px 6px;border-radius:999px;font-weight:700}
  .nav{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:var(--mut);font-weight:600;font-size:13.5px;cursor:pointer}
  .nav:hover{background:#f8fafc;color:var(--ink)}.nav.on{background:var(--acc-soft);color:var(--acc)}
  /* main */
  .main{display:flex;flex-direction:column;min-width:0;height:100vh}
  .top{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:#fff;flex-shrink:0}
  .search{flex:1;max-width:520px;display:flex;align-items:center;gap:9px;background:#f4f6fb;border:1px solid var(--line);border-radius:10px;padding:8px 13px;color:var(--mut)}
  .search input{border:0;background:transparent;outline:0;flex:1;font-family:inherit;font-size:13.5px;color:var(--ink)}
  .iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px}
  .avatar{width:32px;height:32px;border-radius:50%;background:#c7d2fe;display:grid;place-items:center;font-weight:700;color:#3730a3;font-size:13px}
  /* work area: queue + detail */
  .work{display:grid;grid-template-columns:330px 1fr;flex:1;min-height:0}
  .queue{border-right:1px solid var(--line);background:#fff;display:flex;flex-direction:column;min-height:0}
  .qhead{padding:14px 16px 10px;font-weight:800;font-size:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
  .qhead .cnt{font-size:11px;color:var(--mut);font-weight:600}
  .qlist{overflow:auto;padding:8px}
  .qi{display:flex;gap:10px;padding:10px;border-radius:10px;cursor:pointer;align-items:center;border:1px solid transparent}
  .qi:hover{background:#f8fafc}.qi.on{background:var(--acc-soft);border-color:#bfdbfe}
  .qi .bar{width:4px;align-self:stretch;border-radius:4px;min-height:34px}
  .qi .lv{font-weight:800;font-size:11px;min-width:30px;text-align:center;padding:3px 0;border-radius:6px}
  .qi .txt{flex:1;min-width:0}
  .qi .d{font-size:12.5px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qi .m{font-size:10.5px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* detail */
  .detail{overflow:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px}
  .ahead{background:#fff;border:1px solid var(--line);border-left:4px solid var(--crit);border-radius:12px;padding:16px 18px}
  .ahead .row1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .ahead h1{margin:0;font-size:18px;font-weight:800}
  .pill{font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:999px;letter-spacing:.02em}
  .pill.crit{background:#fee2e2;color:#b91c1c}.pill.high{background:#ffedd5;color:#c2410c}.pill.med{background:#fef3c7;color:#b45309}.pill.low{background:#dbeafe;color:#1d4ed8}
  .meta{display:flex;gap:26px;margin-top:12px;flex-wrap:wrap}
  .meta .m{display:flex;gap:8px;align-items:flex-start}
  .meta .mi{color:var(--acc);font-size:14px;margin-top:1px}
  .meta small{color:var(--mut);font-size:10.5px;display:block;font-weight:600}
  .meta b{font-size:13px;font-weight:700}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h3{margin:0 0 11px;font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:7px}
  .muted{color:var(--mut)}
  .sumhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
  .conf{background:#dcfce7;color:#15803d;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px}
  .prose{line-height:1.65}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .li{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:13px;line-height:1.45}
  .li .dot{color:var(--acc);margin-top:1px}
  .li input{margin-top:3px}
  .mitre{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .mc{border-radius:10px;padding:11px;border:1px solid}
  .mc b{font-size:14px;font-weight:800}.mc .mn{font-size:10.5px;margin:3px 0 7px;line-height:1.3}
  .mc .tag{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:#fff}
  .raw{background:#0f172a;color:#93c5fd;border-radius:10px;padding:13px;font-size:11.5px;white-space:pre-wrap;word-break:break-all;margin-top:4px}
  details summary{cursor:pointer;font-weight:700;font-size:13px}
  .empty{display:grid;place-items:center;height:100%;color:var(--mut);text-align:center;gap:8px}
  .spinner{width:15px;height:15px;border:2px solid #cbd5e1;border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:900px){.work{grid-template-columns:1fr}.queue{max-height:35vh}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect}=React;
const sevOf=lv=>lv>=12?["crit","var(--crit)","CRITICAL"]:lv>=7?["high","var(--high)","HIGH"]:lv>=4?["med","var(--med)","MEDIUM"]:["low","var(--low)","LOW"];
const sevColor=s=>({CRITICAL:"var(--crit)",HIGH:"var(--high)",MEDIUM:"var(--med)",LOW:"var(--low)"}[(s||"").toUpperCase()]||"var(--mut)");
const sevCls=s=>({CRITICAL:"crit",HIGH:"high",MEDIUM:"med",LOW:"low"}[(s||"").toUpperCase()]||"low");
const hhmm=ts=>{try{return new Date(ts).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit',day:'2-digit',month:'2-digit'});}catch(e){return '—'}};
const MC=[["#fef2f2","#fecaca","#b91c1c"],["#fff7ed","#fed7aa","#c2410c"],["#fffbeb","#fde68a","#b45309"],["#eff6ff","#bfdbfe","#1d4ed8"],["#faf5ff","#e9d5ff","#7e22ce"]];

function Sidebar(){
  const items=[["🔔","Alerts",1],["📄","Reports"],["📖","Knowledge Base"],["⚙️","Settings"]];
  return <div className="side">
    <div className="brand"><div className="logo">🛡️</div><div><b>AI Investigation</b><b>Assistant</b><span className="cloud">Cloud SOC</span></div></div>
    {items.map(([ic,l,on],i)=><div key={i} className={"nav"+(on?" on":"")}>{ic} {l}</div>)}
  </div>;
}

function Queue({alerts,sel,onSel}){
  return <div className="queue">
    <div className="qhead"><span>🔔 Hàng đợi cảnh báo</span><span className="cnt">{alerts.length} alert</span></div>
    <div className="qlist">
      {alerts.length===0&&<div className="muted" style={{padding:16,fontSize:13}}>Chưa có alert. Bấm ↻ để tải từ Wazuh.</div>}
      {alerts.map((a,i)=>{const[,col]=sevOf(a.rule?.level||0);return(
        <div key={i} className={"qi"+(sel===a?" on":"")} onClick={()=>onSel(a)}>
          <div className="bar" style={{background:col}}></div>
          <div className="lv" style={{background:col+"22",color:col}}>L{a.rule?.level}</div>
          <div className="txt">
            <div className="d">{(a.rule?.description||a.data?.event||"alert").split(" from ")[0]}</div>
            <div className="m">{hhmm(a.timestamp)} · {a.data?.srcip||"—"}</div>
          </div>
        </div>);})}
    </div>
  </div>;
}

function Detail({sel,analysis,loading}){
  if(!sel) return <div className="detail"><div className="empty"><div style={{fontSize:40}}>🛡️</div><div>Chọn 1 cảnh báo bên trái để AI phân tích.</div></div></div>;
  const lvl=sel.rule?.level||0; const sev=analysis?.severity||sevOf(lvl)[2]; const meta=analysis?._meta||{};
  return <div className="detail">
    {/* header của alert được chọn */}
    <div className="ahead" style={{borderLeftColor:sevColor(sev)}}>
      <div className="row1">
        <h1>{(analysis?.incident_type||sel.rule?.description||"—").split(" from ")[0]}</h1>
        <span className={"pill "+sevCls(sev)}>{sev}</span>
        <span className="muted" style={{fontSize:12}}>rule {sel.rule?.id} · L{lvl}</span>
      </div>
      <div className="meta">
        <div className="m"><span className="mi">🌐</span><div><small>Source IP</small><b>{sel.data?.srcip||"—"}</b></div></div>
        <div className="m"><span className="mi">🖥️</span><div><small>Target</small><b>{sel.agent?.name||"—"} {sel.agent?.ip?"("+sel.agent.ip+")":""}</b></div></div>
        <div className="m"><span className="mi">📅</span><div><small>Thời điểm</small><b>{hhmm(sel.timestamp)}</b></div></div>
        <div className="m"><span className="mi">🔗</span><div><small>URL/Sự kiện</small><b>{(sel.data?.url||sel.data?.event||"—").slice(0,40)}</b></div></div>
      </div>
    </div>

    {loading&&<div className="card"><span className="spinner"></span> <span className="muted">Opus 5.5 đang phân tích...</span></div>}

    {analysis&&<>
      <div className="card">
        <div className="sumhead"><h3>✨ Phân tích của AI</h3>{analysis.confidence!=null&&<span className="conf">Độ tin cậy {analysis.confidence}%</span>}</div>
        <div className="prose">{analysis.summary}</div>
        {analysis.impact&&<p className="muted" style={{marginTop:10,fontSize:13}}><b>Tác động:</b> {analysis.impact}</p>}
      </div>

      <div className="cols">
        <div className="card"><h3>📋 Bằng chứng</h3>{(analysis.evidence||[]).map((e,i)=><div key={i} className="li"><span className="dot">•</span><span>{e}</span></div>)}{!analysis.evidence?.length&&<div className="muted">—</div>}</div>
        <div className="card"><h3>✅ Khuyến nghị xử lý</h3>{(analysis.recommendations||[]).map((r,i)=><label key={i} className="li"><input type="checkbox"/><span>{r}</span></label>)}{!analysis.recommendations?.length&&<div className="muted">—</div>}</div>
      </div>

      <div className="card"><h3>🎯 MITRE ATT&CK</h3>
        <div className="mitre">{(analysis.mitre||[]).map((m,i)=>{const[bg,bd,fg]=MC[i%5];return(
          <div key={i} className="mc" style={{background:bg,borderColor:bd}}><b style={{color:fg}}>{m.id}</b><div className="mn">{m.name}</div><span className="tag" style={{color:fg}}>{m.tactic}</span></div>);})}
          {!analysis.mitre?.length&&<div className="muted">—</div>}
        </div>
      </div>
    </>}

    <div className="card"><details><summary>📄 Raw log (dữ liệu gốc từ Wazuh)</summary><div className="raw mono">{sel.full_log||JSON.stringify(sel,null,2)}</div></details></div>
  </div>;
}

function App(){
  const [alerts,setAlerts]=useState([]);
  const [sel,setSel]=useState(null);
  const [analysis,setAnalysis]=useState(null);
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState("");

  const load=async()=>{
    setErr("");
    try{const r=await fetch('/api/alerts?limit=20');const d=await r.json();
      const list=(d.alerts||[]).sort((a,b)=>(b.rule?.level||0)-(a.rule?.level||0));
      setAlerts(list); if(d.error)setErr(d.error);
    }catch(e){setErr(String(e));}
  };
  const select=async(a)=>{
    setSel(a);setAnalysis(null);setLoading(true);
    try{const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({alert:a})});
      const d=await r.json();setAnalysis(d.analysis);
    }catch(e){setErr(String(e));}
    setLoading(false);
  };
  useEffect(()=>{load();},[]);

  return <div className="app">
    <Sidebar/>
    <div className="main">
      <div className="top">
        <div className="search">🔍 <input placeholder="Tìm alert, IP, URL..."/></div>
        <button className="iconbtn" onClick={load} title="Tải lại alert từ Wazuh">↻</button>
        <div className="avatar">A</div>
      </div>
      {err&&<div style={{background:'#fef2f2',color:'#b91c1c',padding:'8px 20px',fontSize:13}}>⚠️ {err}</div>}
      <div className="work">
        <Queue alerts={alerts} sel={sel} onSel={select}/>
        <Detail sel={sel} analysis={analysis} loading={loading}/>
      </div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
