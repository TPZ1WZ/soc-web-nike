# ⚠️ LAB SOC — deploy trên EC2. Chạy: docker compose -f docker-compose.prod.yml up -d --build
# App vá»›i log ghi ra ./logs (Wazuh agent trên host đọc thư mục này).
services:
  postgres:
    image: postgres:16
    container_name: cps_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cps_db
      POSTGRES_USER: cps
      POSTGRES_PASSWORD: cps
      TZ: Asia/Ho_Chi_Minh
    # log_statement=all: PostgreSQL ghi mọi câu lệnh (phục vụ điều tra SQLi)
    command: ["postgres", "-c", "log_statement=all", "-c", "log_min_error_statement=error"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [soc]

  web:
    build: .
    image: cps_web
    container_name: cps_spring_app
    restart: unless-stopped
    depends_on: [postgres]
    environment:
      # preferQueryMode=simple để Postgres log verbatim câu SQLi
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cps_db?preferQueryMode=simple
      SPRING_DATASOURCE_USERNAME: cps
      SPRING_DATASOURCE_PASSWORD: cps
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs        # <-- Wazuh agent đọc app.log, security.log ở đây
      - ./uploads:/app/uploads
    networks: [soc]

volumes:
  pgdata:

networks:
  soc:
